const MK=[];const on={};Object.keys(G).forEach(g=>on[g]=true);let onlyNew=false;

P.forEach(p=>{
 const g=grp(p.k);
 const tags='<span class="tag" style="background:'+G[g].c+'">'+e(G[g].n)+'</span>'+(p.n?'<span class="tag nw">新着</span>':'');
 const body=p.r?'<ul class="dl">'+p.rows.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul><a class="go" href="'+e(U(p))+'" target="_blank" rel="noopener">この物件を問い合わせる →</a><div class="u2">情報更新日 2026年10月26日／次回更新予定日 2026年10月29日</div>'
  :'<div class="m">'+[/テラス|区分/.test(p.k)?p.k:'',p.l,p.s].filter(Boolean).map(e).join('<br>')+'</div><a class="go" href="'+e(U(p))+'" target="_blank" rel="noopener">詳しく見る →</a>';
 const html='<div class="card">'+(p.i?'<img src="'+e(p.i)+'" alt="'+e(p.a+' '+p.k)+'" loading="lazy">':'')+'<div class="b"><div class="k">'+tags+' '+e(p.a)+'</div><div class="p">'+e(p.p)+'</div>'+body+'</div></div>';
 MK.push({g:g,n:!!p.n,mk:L.marker([p.y,p.x],{icon:icon(g,p.n),title:G[g].n+' '+p.a,zIndexOffset:p.n?200:0}).bindPopup(html,{maxWidth:300,autoPanPadding:[16,60]})});
});
redraw();

L.marker([OF.y,OF.x],{icon:L.divIcon({className:'of',html:'<div><b>TKグランクス 事務所</b><i></i></div>',iconSize:[0,0]}),zIndexOffset:1000}).addTo(m)
 .bindPopup('<div class="card"><div class="b"><div class="k">事務所</div><div class="p" style="font-size:16px">TKグランクス株式会社</div><ul class="dl"><li>大阪市西成区松1丁目6-15 ファニーハースト102</li><li>天下茶屋駅から約550m・徒歩7分</li><li>ご来店は予約制です</li><li>TEL 090-5676-1912（毎日8〜19時）</li></ul><a class="go" href="https://tk-granks.co.jp/contact?utm_source=hp_map&utm_medium=map&utm_campaign=bukken_map&utm_content=office" target="_blank" rel="noopener">来店の予約・お問い合わせ →</a></div></div>',{maxWidth:300});
const cnt={};P.forEach(p=>{const g=grp(p.k);cnt[g]=(cnt[g]||0)+1});
const lg=document.getElementById('legend');
Object.keys(G).forEach(g=>{const bt=document.createElement('button');bt.type='button';bt.className='chip on';bt.setAttribute('aria-pressed','true');
 bt.innerHTML='<i style="background:'+G[g].c+'"></i>'+G[g].n+' <span>'+(cnt[g]||0)+'</span>';
 bt.onclick=()=>{const v=bt.classList.toggle('on');bt.setAttribute('aria-pressed',v);on[g]=v;redraw();};
 lg.appendChild(bt);});
const nb=document.createElement('button');nb.type='button';nb.className='chip';nb.setAttribute('aria-pressed','false');
const nn=P.filter(p=>p.n).length;nb.innerHTML='<i style="background:#D62828"></i>新着だけ <span>'+nn+'</span>';
nb.onclick=()=>{onlyNew=nb.classList.toggle('on');nb.setAttribute('aria-pressed',onlyNew);redraw();};
lg.appendChild(nb);
